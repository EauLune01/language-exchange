<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f3f5fc">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <title data-i18n="app.name"></title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+SC:wght@400;500&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="page">
    <!-- 로고·메뉴·화면 언어 선택·로그아웃은 common.js 가 여기에 그립니다. 화면 문구는 data-i18n 키로만 씁니다. -->
    <header class="site-header" data-nav="home"></header>

    <main>
        <!-- 주제 뽑기 -->
        <section class="hero" aria-labelledby="hero-title">
            <div class="hero-copy">
                <h1 id="hero-title" class="hero-title" data-i18n="home.hero.title"></h1>
                <p id="hero-desc" class="hero-desc" data-i18n="home.hero.desc"></p>
            </div>

            <div class="card-stage">
                <button type="button" id="weekly-card" class="weekly-card is-empty" disabled
                        data-i18n-aria-label="home.card.emptyLabel">
                    <span class="venn" aria-hidden="true">
                        <span class="venn-circle venn-circle--a"></span>
                        <span class="venn-circle venn-circle--b"></span>
                    </span>
                    <span class="card-text">
                        <span id="weekly-a" class="card-name card-name--a" data-i18n="home.card.placeholder"></span>
                        <span id="weekly-b" class="card-name card-name--b"></span>
                    </span>
                </button>
            </div>

            <div class="hero-actions">
                <p id="weekly-hint" class="hint" data-i18n="home.card.hint" hidden></p>
                <div id="weekly-message" class="message" role="alert" hidden></div>

                <button type="button" id="draw-button" class="primary" hidden>
                    <span class="btn-line" data-i18n="home.draw"></span>
                </button>
                <!-- 방금 뽑은 주제에만 나옵니다 (home.js) -->
                <button type="button" id="pass-button" class="secondary" data-i18n="home.pass" hidden></button>
            </div>
        </section>

        <!-- 펫: 방의 두 언어 조합마다 동물이 하나씩 있고, 학습 횟수가 레벨입니다. 한 번이라도 뽑으면 home.js 가 보여줍니다. -->
        <section id="pet-section" class="pet-display" data-i18n-aria-label="stats.pet" hidden>
            <span id="pet-emoji" class="pet-emoji" aria-hidden="true"></span>
            <div class="pet-info">
                <span class="pet-head">
                    <span id="pet-name" class="pet-name"></span>
                    <span id="pet-level" class="pet-level-label"></span>
                </span>
                <div id="pet-track" class="pet-bar-track" role="progressbar"
                     aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-labelledby="pet-name">
                    <div id="pet-bar" class="pet-bar"></div>
                </div>
            </div>
        </section>

        <!-- 바로가기 -->
        <section class="shortcuts" data-i18n-aria-label="home.shortcuts.label">
            <a class="shortcut" href="topics.html">
                <span class="shortcut-title" data-i18n="nav.topics"></span>
                <span class="shortcut-desc" data-i18n="home.shortcut.topics"></span>
            </a>

            <a class="shortcut" href="history.html">
                <span class="shortcut-title" data-i18n="nav.history"></span>
                <span class="shortcut-desc" data-i18n="home.shortcut.history"></span>
            </a>

            <a class="shortcut" href="register.html">
                <span class="shortcut-title" data-i18n="nav.register"></span>
                <span class="shortcut-desc" data-i18n="home.shortcut.register"></span>
            </a>
        </section>
    </main>
</div>

<!-- 질문 보기: 제목과 토글은 그 방의 두 언어(A, B 순서)로 sheet.js 가 채웁니다. -->
<dialog id="questions-dialog" class="sheet-dialog" data-i18n-aria-label="sheet.label">
    <div class="sheet">
        <div class="sheet-head">
            <div class="sheet-titles">
                <p id="dialog-a" class="sheet-title sheet-title--a"></p>
                <p id="dialog-b" class="sheet-title sheet-title--b"></p>
            </div>
            <button type="button" id="dialog-close" class="icon-button" data-i18n-aria-label="sheet.close">
                <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false">
                    <path d="M5 5l14 14M19 5L5 19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </button>
        </div>

        <div id="lang-toggle" class="lang-toggle" role="group" data-i18n-aria-label="sheet.language">
            <button type="button" data-slot="a" aria-pressed="true"></button>
            <button type="button" data-slot="b" aria-pressed="false"></button>
        </div>

        <div id="question-area" class="question-area" aria-live="polite"></div>
    </div>
</dialog>

<!-- 펫 레벨 업 알림 · 100레벨 달성 축하 (문구는 home.js 가 채웁니다) -->
<dialog id="pet-congrats-modal" class="congrats-dialog">
    <form method="dialog" class="congrats-content">
        <p id="congrats-emoji" class="congrats-emoji" aria-hidden="true"></p>
        <p id="congrats-message" class="congrats-message"></p>
        <button type="submit" class="primary" data-i18n="sheet.close"></button>
    </form>
</dialog>

<script src="js/common.js"></script>
<script src="js/pet.js"></script>
<script src="js/sheet.js"></script>
<script src="js/home.js"></script>
</body>
</html>
