<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f3f5fc">
    <title>언어교환 言語交換</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="page">
    <header class="site-header">
      <span class="logo" aria-hidden="true">
        <span class="logo-circle logo-circle--ko"></span>
        <span class="logo-circle logo-circle--ja"></span>
      </span>
        <h1 class="wordmark">
            <span class="wordmark-ko" lang="ko">언어교환</span>
            <span class="wordmark-ja" lang="ja">言語交換</span>
        </h1>

        <a class="header-link" href="topics.html">
            <span lang="ko">전체 주제</span>
            <span lang="ja">すべてのテーマ</span>
        </a>
    </header>

    <main>
        <!-- 이번 주 주제 -->
        <section class="weekly" aria-labelledby="weekly-title">
            <h2 id="weekly-title" class="section-title">
                <span lang="ko">이번 주 주제</span>
                <span lang="ja">今週のテーマ</span>
            </h2>

            <div class="card-stage">
                <button type="button" id="weekly-card" class="weekly-card is-empty" disabled
                        aria-label="아직 뽑지 않은 주제 / まだ引いていないテーマ">
            <span class="venn" aria-hidden="true">
              <span class="venn-circle venn-circle--ko"></span>
              <span class="venn-circle venn-circle--ja"></span>
            </span>
                    <span class="card-text">
              <span id="weekly-ko" class="card-name card-name--ko" lang="ko">이번 주엔 어떤 주제가 나올까요?</span>
              <span id="weekly-ja" class="card-name card-name--ja" lang="ja">今週はどんなテーマかな？</span>
            </span>
                </button>
            </div>

            <p id="weekly-hint" class="hint" hidden>
                <span lang="ko">카드를 눌러 질문을 확인하세요.</span>
                <span lang="ja">カードをタップして質問を見ましょう。</span>
            </p>
            <div id="weekly-message" class="message" role="alert" hidden></div>

            <button type="button" id="draw-button" class="primary">
                <span class="btn-line" lang="ko">이번 주 주제 뽑기</span>
                <span class="btn-line btn-line--sub" lang="ja">今週のテーマを引く</span>
            </button>
        </section>
    </main>
</div>

<!-- 질문 보기 -->
<dialog id="questions-dialog" class="sheet-dialog" aria-label="질문 / 質問">
    <div class="sheet">
        <div class="sheet-head">
            <div class="sheet-titles">
                <p id="dialog-ko" class="sheet-title sheet-title--ko" lang="ko"></p>
                <p id="dialog-ja" class="sheet-title sheet-title--ja" lang="ja"></p>
            </div>
            <button type="button" id="dialog-close" class="icon-button" aria-label="닫기 / 閉じる">
                <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false">
                    <path d="M5 5l14 14M19 5L5 19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </button>
        </div>

        <div id="lang-toggle" class="lang-toggle" role="group" aria-label="언어 / 言語">
            <button type="button" data-lang="KO" aria-pressed="true" lang="ko">한국어</button>
            <button type="button" data-lang="JA" aria-pressed="false" lang="ja">日本語</button>
        </div>

        <div id="question-area" class="question-area" aria-live="polite"></div>
    </div>
</dialog>

<script src="js/common.js"></script>
<script src="js/home.js"></script>
</body>
</html>
