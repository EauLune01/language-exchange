<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f3f5fc">
    <title data-i18n="nav.register"></title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+SC:wght@400;500&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="page">
    <!-- 로고·메뉴·화면 언어 선택·로그아웃은 common.js 가 여기에 그립니다. 화면 문구는 data-i18n 키로만 씁니다. -->
    <header class="site-header" data-nav="register"></header>

    <main>
        <div class="page-head">
            <h1 class="page-title" data-i18n="nav.register"></h1>
            <p class="page-note" data-i18n="register.note"></p>
        </div>

        <div id="mode-toggle" class="mode-toggle" role="group" data-i18n-aria-label="register.mode.label">
            <button type="button" data-mode="single" aria-pressed="true" data-i18n="register.mode.single"></button>
            <button type="button" data-mode="bulk" aria-pressed="false" data-i18n="register.mode.bulk"></button>
        </div>

        <form id="register-form" class="register-form" novalidate>
            <div id="topic-forms" class="topic-forms"></div>

            <div id="form-message" class="message" role="alert" hidden></div>
            <div id="form-success" class="message message--success" role="status" hidden></div>

            <div class="form-actions">
                <button type="button" id="add-topic" class="secondary add-topic" data-i18n="register.add" hidden></button>

                <button type="submit" id="submit-button" class="primary submit-button">
                    <span id="submit-label" class="btn-line" data-i18n="register.submit.single"></span>
                </button>
            </div>
        </form>
    </main>
</div>

<!-- 주제 입력 칸 (주제 이름 1개 + 질문 3개). 왼쪽 칸 = 방의 첫 번째 언어(A), 오른쪽 칸 = 두 번째 언어(B).
     칸 위의 언어 이름은 register.js 가 방 정보에서 읽어 채웁니다. 예시 문구는 화면 언어로 보여줘요. -->
<template id="topic-template">
    <section class="topic-form">
        <div class="topic-form-head">
            <h2 class="topic-form-title"></h2>
            <button type="button" class="text-button topic-remove" data-i18n="register.remove"></button>
        </div>

        <div class="form-row">
            <div class="form-row-name" data-i18n="register.name"></div>
            <label class="field">
                <span class="field-label field-label--a"></span>
                <input type="text" class="field-input field-input--a" data-field="nameA"
                       maxlength="255" autocomplete="off" data-i18n-placeholder="register.placeholder.name">
            </label>
            <label class="field">
                <span class="field-label field-label--b"></span>
                <input type="text" class="field-input field-input--b" data-field="nameB"
                       maxlength="255" autocomplete="off" data-i18n-placeholder="register.placeholder.name">
            </label>
        </div>

        <div class="form-row">
            <div class="form-row-name" data-i18n="register.question" data-i18n-params='{"no": 1}'></div>
            <label class="field">
                <span class="field-label field-label--a"></span>
                <textarea class="field-input field-input--a" data-field="contentA" data-question="0"
                          rows="2" maxlength="255" data-i18n-placeholder="register.placeholder.question"></textarea>
            </label>
            <label class="field">
                <span class="field-label field-label--b"></span>
                <textarea class="field-input field-input--b" data-field="contentB" data-question="0"
                          rows="2" maxlength="255" data-i18n-placeholder="register.placeholder.question"></textarea>
            </label>
        </div>

        <div class="form-row">
            <div class="form-row-name" data-i18n="register.question" data-i18n-params='{"no": 2}'></div>
            <label class="field">
                <span class="field-label field-label--a"></span>
                <textarea class="field-input field-input--a" data-field="contentA" data-question="1"
                          rows="2" maxlength="255"></textarea>
            </label>
            <label class="field">
                <span class="field-label field-label--b"></span>
                <textarea class="field-input field-input--b" data-field="contentB" data-question="1"
                          rows="2" maxlength="255"></textarea>
            </label>
        </div>

        <div class="form-row">
            <div class="form-row-name" data-i18n="register.question" data-i18n-params='{"no": 3}'></div>
            <label class="field">
                <span class="field-label field-label--a"></span>
                <textarea class="field-input field-input--a" data-field="contentA" data-question="2"
                          rows="2" maxlength="255"></textarea>
            </label>
            <label class="field">
                <span class="field-label field-label--b"></span>
                <textarea class="field-input field-input--b" data-field="contentB" data-question="2"
                          rows="2" maxlength="255"></textarea>
            </label>
        </div>
    </section>
</template>

<script src="js/common.js"></script>
<script src="js/register.js"></script>
</body>
</html>
