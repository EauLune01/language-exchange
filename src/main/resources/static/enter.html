<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f3f5fc">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <title data-i18n="app.name"></title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+SC:wght@400;500&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="page">
    <!-- 로고와 화면 언어 선택은 common.js 가 여기에 그립니다. (data-nav 가 없으면 메뉴 없이) -->
    <header class="site-header"></header>

    <main>
        <div class="page-head">
            <div class="page-heading">
                <!-- 화면 언어의 모티프 (장식) -->
                <span class="motif motif--a" aria-hidden="true"></span>
                <h1 class="page-title" data-i18n="enter.heading"></h1>
            </div>
            <p class="page-note" data-i18n="enter.note"></p>
        </div>

        <div id="mode-toggle" class="mode-toggle" role="group" data-i18n-aria-label="enter.mode.label">
            <button type="button" data-mode="login" aria-pressed="true" data-i18n="enter.mode.login"></button>
            <button type="button" data-mode="create" aria-pressed="false" data-i18n="enter.mode.create"></button>
        </div>

        <!-- 로그인 -->
        <form id="login-form" novalidate>
            <section class="topic-form">
                <div class="form-row">
                    <div class="form-row-name" data-i18n="enter.account.title"></div>
                    <label class="field">
                        <span class="field-label" data-i18n="enter.account.loginId"></span>
                        <input type="text" class="field-input field-input--a" name="loginId" maxlength="20" dir="ltr"
                               autocomplete="username" autocapitalize="none" spellcheck="false">
                    </label>
                    <label class="field">
                        <span class="field-label" data-i18n="enter.account.password"></span>
                        <input type="password" class="field-input field-input--a" name="password" maxlength="64" dir="ltr"
                               autocomplete="current-password">
                    </label>
                </div>
            </section>

            <div class="message" role="alert" hidden></div>

            <div class="form-actions">
                <button type="submit" class="primary submit-button">
                    <span class="btn-line" data-i18n="enter.mode.login"></span>
                </button>
            </div>
        </form>

        <!-- 방 만들기 -->
        <form id="create-form" novalidate hidden>
            <p class="page-note form-note" data-i18n="enter.create.note"></p>

            <section class="topic-form">
                <div class="form-row">
                    <div class="form-row-name" data-i18n="enter.account.title"></div>
                    <label class="field">
                        <span class="field-label" data-i18n="enter.account.loginIdRule"></span>
                        <input type="text" class="field-input field-input--a" name="loginId" maxlength="20" dir="ltr"
                               autocomplete="username" autocapitalize="none" spellcheck="false">
                    </label>
                    <label class="field">
                        <span class="field-label" data-i18n="enter.account.passwordRule"></span>
                        <input type="password" class="field-input field-input--a" name="password" maxlength="64" dir="ltr"
                               autocomplete="new-password">
                    </label>
                </div>

                <div class="form-row">
                    <div class="form-row-name" data-i18n="enter.create.name"></div>
                    <label class="field">
                        <span class="field-label field-label--a" data-i18n="enter.create.memberA"></span>
                        <input type="text" class="field-input field-input--a" name="nameA" maxlength="50" dir="auto" autocomplete="off">
                    </label>
                    <label class="field">
                        <span class="field-label field-label--b" data-i18n="enter.create.memberB"></span>
                        <input type="text" class="field-input field-input--b" name="nameB" maxlength="50" dir="auto" autocomplete="off">
                    </label>
                </div>

                <div class="form-row">
                    <div class="form-row-name" data-i18n="enter.create.nationality"></div>
                    <label class="field">
                        <span class="field-label field-label--a" data-i18n="enter.create.memberA"></span>
                        <select class="field-input field-input--a" name="nationalityA"></select>
                    </label>
                    <label class="field">
                        <span class="field-label field-label--b" data-i18n="enter.create.memberB"></span>
                        <select class="field-input field-input--b" name="nationalityB"></select>
                    </label>
                </div>

                <div class="form-row">
                    <div class="form-row-name" data-i18n="enter.create.learningLanguage"></div>
                    <label class="field">
                        <span class="field-label field-label--a" data-i18n="enter.create.memberA"></span>
                        <select class="field-input field-input--a" name="learningLanguageA"></select>
                    </label>
                    <label class="field">
                        <span class="field-label field-label--b" data-i18n="enter.create.memberB"></span>
                        <select class="field-input field-input--b" name="learningLanguageB"></select>
                    </label>
                    <p class="form-row-hint" data-i18n="enter.create.learningLanguageHint"></p>
                </div>

                <div class="form-row">
                    <label class="form-row-name" for="goal" data-i18n="room.goal.label"></label>
                    <select id="goal" class="field-input field-input--a" name="goal">
                        <option>25</option>
                        <option selected>50</option>
                        <option>75</option>
                        <option>100</option>
                    </select>
                </div>
            </section>

            <div class="message" role="alert" hidden></div>

            <div class="form-actions">
                <button type="submit" class="primary submit-button">
                    <span class="btn-line" data-i18n="enter.create.submit"></span>
                </button>
            </div>
        </form>
    </main>
</div>

<!-- languages.js, i18n.js, 사전은 common.js 가 불러옵니다. -->
<script src="js/common.js"></script>
<script src="js/enter.js"></script>
</body>
</html>
