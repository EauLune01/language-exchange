<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f3f5fc">
    <title>언어교환 言語交換</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="page">
    <header class="site-header">
        <a class="brand" href="enter.html" aria-label="언어교환 / 言語交換">
        <span class="logo" aria-hidden="true">
          <span class="logo-circle logo-circle--ko"></span>
          <span class="logo-circle logo-circle--ja"></span>
        </span>
            <span class="wordmark">
          <span class="wordmark-ko" lang="ko">언어교환</span>
          <span class="wordmark-ja" lang="ja">言語交換</span>
        </span>
        </a>
    </header>

    <main>
        <div class="page-head">
            <h1 class="page-title">
                <span lang="ko">우리 방에 들어가기</span>
                <span lang="ja">ふたりのルームに入る</span>
            </h1>
            <p class="page-note">
                <span lang="ko">두 사람이 방 하나를 같이 써요. 방이 있으면 로그인하고, 없으면 새로 만들어 주세요.</span>
                <span lang="ja">ふたりで一つのルームを使います。ルームがあればログインし、なければ新しく作ってください。</span>
            </p>
        </div>

        <div id="mode-toggle" class="mode-toggle" role="group" aria-label="로그인 또는 방 만들기 / ログインまたはルーム作成">
            <button type="button" data-mode="login" aria-pressed="true">
                <span lang="ko">로그인</span>
                <span lang="ja">ログイン</span>
            </button>
            <button type="button" data-mode="create" aria-pressed="false">
                <span lang="ko">방 만들기</span>
                <span lang="ja">ルームを作る</span>
            </button>
        </div>

        <!-- 로그인 -->
        <form id="login-form" novalidate>
            <section class="topic-form">
                <div class="form-row">
                    <div class="form-row-name">
                        <span lang="ko">방 계정</span>
                        <span lang="ja">ルームアカウント</span>
                    </div>
                    <label class="field">
                        <span class="field-label"><span lang="ko">방 아이디</span> / <span lang="ja">ルームID</span></span>
                        <input type="text" class="field-input field-input--ko" name="loginId" maxlength="20"
                               autocomplete="username" autocapitalize="none" spellcheck="false">
                    </label>
                    <label class="field">
                        <span class="field-label"><span lang="ko">비밀번호</span> / <span lang="ja">パスワード</span></span>
                        <input type="password" class="field-input field-input--ko" name="password" maxlength="64"
                               autocomplete="current-password">
                    </label>
                </div>
            </section>

            <div class="message" role="alert" hidden></div>

            <div class="form-actions">
                <button type="submit" class="primary submit-button">
                    <span class="btn-line" lang="ko">로그인</span>
                    <span class="btn-line btn-line--sub" lang="ja">ログイン</span>
                </button>
            </div>
        </form>

        <!-- 방 만들기 -->
        <form id="create-form" novalidate hidden>
            <p class="page-note form-note">
                <span lang="ko">방 아이디와 비밀번호는 두 사람이 같이 써요. 비밀번호를 잊으면 되찾을 방법이 없으니 꼭 적어 두세요.</span>
                <span lang="ja">ルームIDとパスワードはふたりで共有します。パスワードを忘れると復元できないので、必ずメモしておいてください。</span>
            </p>

            <section class="topic-form">
                <div class="form-row">
                    <div class="form-row-name">
                        <span lang="ko">방 계정</span>
                        <span lang="ja">ルームアカウント</span>
                    </div>
                    <label class="field">
                        <span class="field-label"><span lang="ko">방 아이디 (영문 소문자·숫자 4~20자)</span> / <span lang="ja">ルームID（英小文字・数字4〜20文字）</span></span>
                        <input type="text" class="field-input field-input--ko" name="loginId" maxlength="20"
                               autocomplete="username" autocapitalize="none" spellcheck="false">
                    </label>
                    <label class="field">
                        <span class="field-label"><span lang="ko">비밀번호 (8자 이상)</span> / <span lang="ja">パスワード（8文字以上）</span></span>
                        <input type="password" class="field-input field-input--ko" name="password" maxlength="64"
                               autocomplete="new-password">
                    </label>
                </div>

                <div class="form-row">
                    <div class="form-row-name">
                        <span lang="ko">이름</span>
                        <span lang="ja">名前</span>
                    </div>
                    <label class="field">
                        <span class="field-label field-label--ko"><span lang="ko">첫 번째 사람</span> / <span lang="ja">1人目</span></span>
                        <input type="text" class="field-input field-input--ko" name="nameA" maxlength="50" autocomplete="off">
                    </label>
                    <label class="field">
                        <span class="field-label field-label--ja"><span lang="ko">두 번째 사람</span> / <span lang="ja">2人目</span></span>
                        <input type="text" class="field-input field-input--ja" name="nameB" maxlength="50" autocomplete="off">
                    </label>
                </div>

                <div class="form-row">
                    <div class="form-row-name">
                        <span lang="ko">국적</span>
                        <span lang="ja">国籍</span>
                    </div>
                    <label class="field">
                        <span class="field-label field-label--ko"><span lang="ko">첫 번째 사람</span> / <span lang="ja">1人目</span></span>
                        <select class="field-input field-input--ko" name="nationalityA"></select>
                    </label>
                    <label class="field">
                        <span class="field-label field-label--ja"><span lang="ko">두 번째 사람</span> / <span lang="ja">2人目</span></span>
                        <select class="field-input field-input--ja" name="nationalityB"></select>
                    </label>
                </div>

                <div class="form-row">
                    <div class="form-row-name">
                        <span lang="ko">모국어</span>
                        <span lang="ja">母語</span>
                    </div>
                    <label class="field">
                        <span class="field-label field-label--ko"><span lang="ko">첫 번째 사람</span> / <span lang="ja">1人目</span></span>
                        <select class="field-input field-input--ko" name="languageA"></select>
                    </label>
                    <label class="field">
                        <span class="field-label field-label--ja"><span lang="ko">두 번째 사람</span> / <span lang="ja">2人目</span></span>
                        <select class="field-input field-input--ja" name="languageB"></select>
                    </label>
                </div>
            </section>

            <div class="message" role="alert" hidden></div>

            <div class="form-actions">
                <button type="submit" class="primary submit-button">
                    <span class="btn-line" lang="ko">방 만들고 시작하기</span>
                    <span class="btn-line btn-line--sub" lang="ja">ルームを作って始める</span>
                </button>
            </div>
        </form>
    </main>
</div>

<script src="js/common.js"></script>
<script src="js/languages.js"></script>
<script src="js/enter.js"></script>
</body>
</html>
