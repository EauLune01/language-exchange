<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f3f5fc">
    <title data-i18n="app.name"></title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+SC:wght@400;500&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="page">
    <!-- 화면 언어 선택은 common.js 가 헤더에 넣습니다. -->
    <header class="site-header">
        <a class="brand" href="enter.html">
        <span class="logo" aria-hidden="true">
          <span class="logo-circle logo-circle--ko"></span>
          <span class="logo-circle logo-circle--ja"></span>
        </span>
            <span class="wordmark" data-i18n="app.name"></span>
        </a>
    </header>

    <main>
        <div class="page-head">
            <h1 class="page-title" data-i18n="enter.heading"></h1>
            <p class="page-note" data-i18n="enter.note"></p>
        </div>

        <div id="mode-toggle" class="mode-toggle" role="group" data-i18n-aria-label="enter.mode.label">
            <button type="button" data-mode="login" aria-pressed="true" data-i18n="enter.mode.login"></button>
            <button type="button" data-mode="create" aria-pressed="false" data-i18n="enter.mode.create"></button>
        </div>

        <!-- 로그인 -->
        <form id="login-form" novalidate>
            <section class="topic-form">
                <div class="form-row">
                    <div class="form-row-name" data-i18n="enter.account.title"></div>
                    <label class="field">
                        <span class="field-label" data-i18n="enter.account.loginId"></span>
                        <input type="text" class="field-input field-input--ko" name="loginId" maxlength="20" dir="ltr"
                               autocomplete="username" autocapitalize="none" spellcheck="false">
                    </label>
                    <label class="field">
                        <span class="field-label" data-i18n="enter.account.password"></span>
                        <input type="password" class="field-input field-input--ko" name="password" maxlength="64" dir="ltr"
                               autocomplete="current-password">
                    </label>
                </div>
            </section>

            <div class="message" role="alert" hidden></div>

            <div class="form-actions">
                <button type="submit" class="primary submit-button">
                    <span class="btn-line" data-i18n="enter.mode.login"></span>
                </button>
            </div>
        </form>

        <!-- 방 만들기 -->
        <form id="create-form" novalidate hidden>
            <p class="page-note form-note" data-i18n="enter.create.note"></p>

            <section class="topic-form">
                <div class="form-row">
                    <div class="form-row-name" data-i18n="enter.account.title"></div>
                    <label class="field">
                        <span class="field-label" data-i18n="enter.account.loginIdRule"></span>
                        <input type="text" class="field-input field-input--ko" name="loginId" maxlength="20" dir="ltr"
                               autocomplete="username" autocapitalize="none" spellcheck="false">
                    </label>
                    <label class="field">
                        <span class="field-label" data-i18n="enter.account.passwordRule"></span>
                        <input type="password" class="field-input field-input--ko" name="password" maxlength="64" dir="ltr"
                               autocomplete="new-password">
                    </label>
                </div>

                <div class="form-row">
                    <div class="form-row-name" data-i18n="enter.create.name"></div>
                    <label class="field">
                        <span class="field-label field-label--ko" data-i18n="enter.create.memberA"></span>
                        <input type="text" class="field-input field-input--ko" name="nameA" maxlength="50" dir="auto" autocomplete="off">
                    </label>
                    <label class="field">
                        <span class="field-label field-label--ja" data-i18n="enter.create.memberB"></span>
                        <input type="text" class="field-input field-input--ja" name="nameB" maxlength="50" dir="auto" autocomplete="off">
                    </label>
                </div>

                <div class="form-row">
                    <div class="form-row-name" data-i18n="enter.create.nationality"></div>
                    <label class="field">
                        <span class="field-label field-label--ko" data-i18n="enter.create.memberA"></span>
                        <select class="field-input field-input--ko" name="nationalityA"></select>
                    </label>
                    <label class="field">
                        <span class="field-label field-label--ja" data-i18n="enter.create.memberB"></span>
                        <select class="field-input field-input--ja" name="nationalityB"></select>
                    </label>
                </div>

                <div class="form-row">
                    <div class="form-row-name" data-i18n="enter.create.language"></div>
                    <label class="field">
                        <span class="field-label field-label--ko" data-i18n="enter.create.memberA"></span>
                        <select class="field-input field-input--ko" name="languageA"></select>
                    </label>
                    <label class="field">
                        <span class="field-label field-label--ja" data-i18n="enter.create.memberB"></span>
                        <select class="field-input field-input--ja" name="languageB"></select>
                    </label>
                </div>
            </section>

            <div class="message" role="alert" hidden></div>

            <div class="form-actions">
                <button type="submit" class="primary submit-button">
                    <span class="btn-line" data-i18n="enter.create.submit"></span>
                </button>
            </div>
        </form>
    </main>
</div>

<!-- languages.js, i18n.js, 사전은 common.js 가 불러옵니다. -->
<script src="js/common.js"></script>
<script src="js/enter.js"></script>
</body>
</html>
