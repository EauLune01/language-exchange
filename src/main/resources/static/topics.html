<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f3f5fc">
    <meta name="description" content="서강대 언어교환 모임에서 사용할 수 있는 전체 대화 주제 목록을 확인하세요.">
    <meta name="keywords" content="언어교환, language exchange, 서강대">
    <meta property="og:title" content="언어교환 - 전체 주제 목록">
    <meta property="og:description" content="서강대 언어교환 모임에서 사용할 수 있는 전체 대화 주제 목록을 확인하세요.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://sogang-language-exchange.duckdns.org/topics.html">
    <meta property="og:site_name" content="서강대 언어교환">
    <meta property="og:locale" content="ko_KR">
    <meta property="og:image" content="https://sogang-language-exchange.duckdns.org/img/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="서강대 언어교환">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="canonical" href="https://sogang-language-exchange.duckdns.org/topics.html">
    <meta name="robots" content="index, follow">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <title data-i18n="nav.topics">전체 주제</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+SC:wght@400;500&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="page">
    <!-- 로고·메뉴·화면 언어 선택·로그아웃은 common.js 가 여기에 그립니다. 화면 문구는 data-i18n 키로만 씁니다. -->
    <header class="site-header" data-nav="topics"></header>

    <main>
        <div class="page-head">
            <h1 class="page-title" data-i18n="nav.topics"></h1>
            <p class="page-note" data-i18n="topics.note"></p>
        </div>

        <ul id="topic-list" class="topic-list"></ul>
        <div id="list-message" class="message" hidden></div>

        <button type="button" id="load-more" class="secondary load-more" data-i18n="common.loadMore" hidden></button>
    </main>
</div>

<!-- 질문 보기: 제목과 토글은 그 방의 두 언어(A, B 순서)로 sheet.js 가 채웁니다. -->
<dialog id="questions-dialog" class="sheet-dialog" data-i18n-aria-label="sheet.label">
    <div class="sheet">
        <div class="sheet-head">
            <div class="sheet-titles">
                <p id="dialog-a" class="sheet-title sheet-title--a"></p>
                <p id="dialog-b" class="sheet-title sheet-title--b"></p>
            </div>
            <button type="button" id="dialog-close" class="icon-button" data-i18n-aria-label="sheet.close">
                <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false">
                    <path d="M5 5l14 14M19 5L5 19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </button>
        </div>

        <div id="lang-toggle" class="lang-toggle" role="group" data-i18n-aria-label="sheet.language">
            <button type="button" data-slot="a" aria-pressed="true"></button>
            <button type="button" data-slot="b" aria-pressed="false"></button>
        </div>

        <div id="question-area" class="question-area" aria-live="polite"></div>
    </div>
</dialog>

<script src="js/common.js"></script>
<script src="js/sheet.js"></script>
<script src="js/topics.js"></script>
</body>
</html>
