events {}
http {
    server {
        listen 80;
        server_name sogang-language-exchange.duckdns.org;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name sogang-language-exchange.duckdns.org;

        ssl_certificate /etc/letsencrypt/live/sogang-language-exchange.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/sogang-language-exchange.duckdns.org/privkey.pem;

        location / {
            # 앱을 재배포하면 컨테이너 IP 가 바뀐다. 변수로 넘겨야 nginx 가 시작할 때 한 번이 아니라 주기적으로 다시 조회한다.
            resolver 127.0.0.11 valid=10s;
            set $app http://app:8080;
            proxy_pass $app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

}
